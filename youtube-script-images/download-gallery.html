<script>
const DATA=[{"t": "0:00", "line": "Sometime this week you're going to sign up for something.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_144601_29c13f64-1290-4748-adaa-a544c22f2cc2.png"}, {"t": "0:03", "line": "It'll take 30 seconds, one thumb, Apple Pay, done.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_144950_f45db57c-3676-4de9-ac9f-697edd574065.png"}, {"t": "0:07", "line": "Now try to leave.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_144953_25a9cee3-5428-450c-a237-0436aa95c278.png"}, {"t": "0:08", "line": "The cancel button isn't in the app.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_144957_6ec4cb1a-b36c-427f-b81c-4d9ed6a83115.png"}, {"t": "0:10", "line": "It's on the website, desktop only, behind a menu called manage,", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_144959_c142f323-ddad-42d0-8138-506e96d32159.png"}, {"t": "0:14", "line": "inside a menu called settings, then a chat window,", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145001_401b2a18-d867-4d8e-b725-08c46618f4c5.png"}, {"t": "0:17", "line": "then a discount, then three screens asking if you're sure.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145003_a4d6d17a-29e5-4c8b-80b9-dad5febf5ac2.png"}, {"t": "0:21", "line": "Signing up took 30 seconds, cancelling will take 30 minutes", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145006_ef7b4144-2c12-4f91-a911-b672f1bda7cc.png"}, {"t": "0:25", "line": "and that gap is not an accident, or is it?", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145009_76fa0b0d-1487-47ed-a653-a6f535014160.png"}, {"t": "0:27", "line": "Because the real answer is stranger than malice.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145033_d3735c18-084b-42c8-8061-8699d6244966.png"}, {"t": "0:30", "line": "There are three reasons that Maize exists", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145104_69cb657b-b31a-4c32-8d4c-0825ff460937.png"}, {"t": "0:32", "line": "and almost nobody talks about the third one.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145107_493b34e2-e770-4463-9498-e0f5f5b88325.png"}, {"t": "0:35", "line": "This is sold by design.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145112_0fb91825-26ee-407c-bc0a-270224de4b6c.png"}, {"t": "0:37", "line": "Why people buy.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145117_b4c69429-1fef-407a-9c85-a7a3d528b11c.png"}, {"t": "0:38", "line": "From the supermarket shelf to the seven-figure software deal.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145122_40648349-bac4-47e3-ba93-9c86623a5499.png"}, {"t": "0:41", "line": "Start with the receipts because we now have them under oath.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145124_38ed4087-b093-42c9-826e-7b5aea17c207.png"}, {"t": "0:45", "line": "Amazon Prime.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145126_8e4da30e-b161-4952-bfc8-6174454b90aa.png"}, {"t": "0:46", "line": "Joining takes one click.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145129_7a396fec-dbd0-4584-a326-38ed093a7f99.png"}, {"t": "0:48", "line": "Leaving took four pages, six clicks, 15 options,", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145132_eada48ba-4830-4614-a494-471aae3ddb8d.png"}, {"t": "0:51", "line": "discount offers, benefit reminders.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145135_15ba3fb3-12cd-47fc-97cd-c72e943356f1.png"}, {"t": "0:53", "line": "Are you sure screens?", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145205_f8e4bc42-f94e-4c59-b00c-962f8cf14091.png"}, {"t": "0:54", "line": "That's not my count.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145207_2376a822-53ed-41b0-8f38-95ed6b549a90.png"}, {"t": "0:55", "line": "That's the count from the federal regulator that sued them.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145209_a9a59b83-5aa6-4bc1-a8ea-226998c93437.png"}, {"t": "0:59", "line": "And Amazon's own staff had a name for this flow.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145212_b6fbbced-1828-4d03-b711-95fe64470bc6.png"}, {"t": "1:02", "line": "The Iliad, as in Homer,", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145214_7cdbb18e-c906-4d82-a1e4-1c19ae9121e2.png"}, {"t": "1:04", "line": "as in the epic famous for taking 10 years to get to the point.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145216_b48deffe-f3e0-49cd-a66f-a3811340b6ce.png"}, {"t": "1:07", "line": "Think about that.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145222_4611c237-26b2-4911-8cb3-80353e351ac3.png"}, {"t": "1:08", "line": "Somebody named it.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145225_6c2c3b67-36c9-4cbe-9c43-9ff1df87fdaf.png"}, {"t": "1:10", "line": "A flow that drifts into existence by accident does not get a code name.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145227_6fba839e-a399-4aa3-afdc-bd0d51888dc8.png"}, {"t": "1:14", "line": "Here's what the Iliad did.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145239_185a44bc-8e61-487e-afd7-babc30ac832c.png"}, {"t": "1:15", "line": "After it launched in 2017, cancellations dropped 14%,", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145243_60504936-d35d-4988-99aa-b5a3c17bcb1b.png"}, {"t": "1:19", "line": "not because customers got happier,", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145251_fa4a1e10-dd5c-4b59-bf04-108787ae8f2d.png"}, {"t": "1:22", "line": "because fewer of them made it out.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145253_b325edef-8963-477e-ab1f-8fa4b2cc27bf.png"}, {"t": "1:24", "line": "In June 2023, the Federal Trade Commission sued.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145256_7e6e73be-70ed-4083-abb3-800ef5393d46.png"}, {"t": "1:27", "line": "In September 2025, two days into the trial, Amazon settled.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145258_6d48fb0d-2248-4703-8138-1cdc50154c21.png"}, {"t": "1:32", "line": "Two and a half billion dollars.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145300_9e52981a-2da2-4415-862f-c9853d395b16.png"}, {"t": "1:33", "line": "A billion in penalties.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145304_3b417a16-d23a-4a6e-8323-d01891ec6b13.png"}, {"t": "1:35", "line": "A billion and a half back to 35 million customers.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145306_265efb8a-97eb-456a-be7f-096a82846094.png"}, {"t": "1:38", "line": "And a court order to add something radical.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145309_bddca97a-67a5-4ab1-8422-fba0456c1e1c.png"}, {"t": "1:41", "line": "A clear button that says no.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145330_e9ec02c9-40ed-4202-8761-d608525b0e4a.png"}, {"t": "1:42", "line": "Facebook ran the softer version.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145512_1995af37-9749-476e-ac32-b17ba7e5dfe4.png"}, {"t": "1:45", "line": "Try deactivating your account.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145514_f1cac8f4-8e7c-41b0-8e64-b790a46dabb1.png"}, {"t": "1:47", "line": "It shows you photos of your friends.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145516_ec784b32-4ca8-4f88-bb31-f62f443f5069.png"}, {"t": "1:49", "line": "So-and-so will miss you.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145518_9cf2d152-f471-4945-b9d7-69710306e574.png"}, {"t": "1:50", "line": "Persuasion to the last pixel.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145520_ea325ed4-57cb-4c99-92bb-a2cf969f85da.png"}, {"t": "1:53", "line": "And gyms wrote the original playbook.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145522_4447ee3f-9c1a-4bd6-a72f-ad04833ca1b7.png"}, {"t": "1:55", "line": "For years, America's biggest gym chain accepted exactly two ways to cancel.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145524_5a47579c-750d-40eb-b6f9-e842efb46c94.png"}, {"t": "1:59", "line": "Show up in person at the specific club where you signed up.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145526_02cb287b-4769-4561-81b8-dc221af3c2a7.png"}, {"t": "2:03", "line": "Or post a letter.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145528_9b0b846f-4680-429d-9047-ac3cdda4f68f.png"}, {"t": "2:04", "line": "In the age of one tap everything, leaving the gym required a stamp.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145531_1581925d-9fde-4c9a-aedb-046215afe5a7.png"}, {"t": "2:08", "line": "Regulators did write a rule for all of this.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145533_31decb26-60a5-4214-8289-dd538d1c60b2.png"}, {"t": "2:11", "line": "It basically said one thing.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145535_631fc508-d850-4dfc-b4e1-960b34fac4b1.png"}, {"t": "2:13", "line": "Cancelling must be as easy as signing up.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145537_277a08f2-b6ae-42a6-bb3a-d359c558501d.png"}, {"t": "2:15", "line": "A court threw it out six days before it took effect on paperwork grounds.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145540_7b3e0883-6ea1-430e-92aa-b11f72746e6b.png"}, {"t": "2:19", "line": "As of this year, they're trying again.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145543_5bc86c86-3415-4634-afbf-c1df63858289.png"}, {"t": "2:21", "line": "Now, every video about this topic tells you the same story.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145545_18136c89-b139-42a8-bdf3-4ffa2eb41dc4.png"}, {"t": "2:25", "line": "Evil designers.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145547_81a98173-8070-4fb1-9400-73a5b99c0faa.png"}, {"t": "2:26", "line": "Dark patterns.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145549_db298a90-7f21-4506-9b47-c476ea3a0dac.png"}, {"t": "2:27", "line": "Malice all the way down.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145551_19166c59-4e23-4ed5-b77b-ac88b32e0cac.png"}, {"t": "2:29", "line": "And sometimes, Iliad, that's exactly right.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145554_9372fd73-c3ff-4928-9471-09b6405a412f.png"}, {"t": "2:31", "line": "But here's the part nobody talks about.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145611_937331fb-0962-4b33-a859-2ea056444631.png"}, {"t": "2:33", "line": "There are three species of exit.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145613_70ec5530-f0a3-4e15-bed2-16762722c337.png"}, {"t": "2:35", "line": "Not one.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145615_05171a3c-f78f-451c-bfa7-03ab8a0bdb7b.png"}, {"t": "2:36", "line": "The first is the trap.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145617_0b80cfec-3717-498b-81c9-cc0492b7e812.png"}, {"t": "2:37", "line": "Designed.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145620_c833633d-8c04-49cb-adb0-2a0d6b9da625.png"}, {"t": "2:38", "line": "Tested.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145623_572a4717-64fb-4711-93e1-f11247f0a2f2.png"}, {"t": "2:38b", "line": "Named after Greek epics.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145625_4a921676-21d6-4aa0-ac25-606514c5ae32.png"}, {"t": "2:40", "line": "The second is the honest exit.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145627_291fcbc0-33c5-4447-8bc3-18515c523ac8.png"}, {"t": "2:42", "line": "Rare but real.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145643_b56f8c21-6e83-4e94-abdf-fae9de30783d.png"}, {"t": "2:43", "line": "One page.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145644_8ad95e3b-6359-4f91-8c71-2aad99cc3e54.png"}, {"t": "2:43b", "line": "One click.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145647_43e500b2-f7e6-4c23-b658-18c4667d3a83.png"}, {"t": "2:44", "line": "A genuine goodbye.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145649_96670cdd-e07f-49ff-a4ab-a0e481b3d943.png"}, {"t": "2:45", "line": "And the third species explains most of your bad experiences.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145651_9d5a8ae5-deed-4edb-8c94-c52900070ded.png"}, {"t": "2:49", "line": "The neglected exit.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145655_d618b268-6831-4ede-8cb9-b5a58fa42f86.png"}, {"t": "2:50", "line": "Nobody owns the cancellation page.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145701_48f62152-e305-4230-9253-2b38876e775d.png"}, {"t": "2:52", "line": "Nobody ever got promoted for making it smoother.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145702_7707b74f-341e-4e72-810b-3d3a67ec8d29.png"}, {"t": "2:55", "line": "Every roadmap has a workstream for sign-up conversion.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145704_0f5d7837-8048-41ac-be9d-1a7f878647fa.png"}, {"t": "2:58", "line": "Nobody in the history of planning meetings has demanded a more delightful goodbye.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145707_726db073-9599-4552-bf7d-03b1f7b0d47b.png"}, {"t": "3:03", "line": "So the page just rots.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145712_3dd75a06-8514-4eb6-a194-dc9a91dc59fa.png"}, {"t": "3:05", "line": "Broken links.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145715_de51ffcd-94ca-4143-97ff-474bb6f384aa.png"}, {"t": "3:06", "line": "Forms that error out.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145730_7c8ed1c2-177b-408b-bee0-e90f6930cb18.png"}, {"t": "3:07", "line": "A phone number that rings and rings.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145732_d3e73d4e-061d-4383-808e-59fb6ba9f3eb.png"}, {"t": "3:10", "line": "Not malice.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145734_f60b86ec-347e-4b64-b6a8-5a350f1f73c2.png"}, {"t": "3:10b", "line": "An orphan.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145736_0e7e8aad-843e-4bed-becb-01fe220e65d2.png"}, {"t": "3:11", "line": "And you can tell the species apart with a trained eye.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145738_0c2a663b-6193-46ad-9ab1-0e9ecfd76da3.png"}, {"t": "3:14", "line": "Neglect looks stale.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145741_94b910ad-56a1-44a9-8ad5-c4c22f836134.png"}, {"t": "3:16", "line": "Like nobody has touched it in years.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145743_90b38a5f-0711-4a0c-ae71-78b666f18d0c.png"}, {"t": "3:17", "line": "A trap looks polished in exactly the wrong direction.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145746_d4037031-9013-48ea-9df0-64f46364fbbc.png"}, {"t": "3:21", "line": "Every button that keeps you is big and bright.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145749_8aeaf494-b0be-4d43-9ec4-ba2080cf602b.png"}, {"t": "3:23", "line": "The one that frees you is grey text.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145751_055f7984-58fb-4324-863f-e5c64603da8a.png"}, {"t": "3:25", "line": "Size 10.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145754_dbf60a67-af65-4cee-b598-6ab927812a6e.png"}, {"t": "3:26", "line": "Bottom left.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145755_0a5dab08-1c9f-4d84-80b0-fc00bdefbcb5.png"}, {"t": "3:28", "line": "So why do traps keep winning?", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145757_571caec9-bf90-47a8-b87c-c2b557f0534d.png"}, {"t": "3:29", "line": "Follow the dashboard.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145802_1620269f-e689-44d0-bb86-5c19090f1d1c.png"}, {"t": "3:31", "line": "Inside every subscription business there's a number called save rate.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145804_88c77753-7329-4884-8bbc-5c6abb7d0d1e.png"}, {"t": "3:34", "line": "The percentage of people who tried to leave and got talked out of it.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145806_17e67ccb-28b9-495a-8dc5-3612341d9ec9.png"}, {"t": "3:38", "line": "It's measured weekly.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145808_6f192b0f-9b6f-4441-8578-943aa1df9ae1.png"}, {"t": "3:39", "line": "It's celebrated.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145811_3269fa8c-38f2-49e7-9a39-36864b7fe97a.png"}, {"t": "3:40", "line": "And somewhere it's attached to a bonus.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145813_ee877a21-4ad3-4db1-a284-b09a02b3299d.png"}, {"t": "3:43", "line": "Now here's the number that isn't on any dashboard.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145816_2f9e5c94-0272-4cbe-8150-48667b1a1d05.png"}, {"t": "3:45", "line": "Resentment.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145831_54463af5-7b90-4665-9dfc-52a592aeff67.png"}, {"t": "3:46", "line": "Mildly unhappy customers leave quietly.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145834_12b77058-88cc-4019-a334-cf973685c16b.png"}, {"t": "3:49", "line": "They forget you.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145837_a2f8657b-7c24-433c-8cc1-2ef55de925c7.png"}, {"t": "3:50", "line": "Trapped customers leave furious.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145859_ed6c628b-b48d-45ad-a34b-e7d979a31073.png"}, {"t": "3:52", "line": "And they recruit.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145903_97459864-e91d-4374-b043-b1d006e99796.png"}, {"t": "3:53", "line": "They warn their friends.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145906_86a08f0b-517a-4f88-8c85-ad7d8bb91ed0.png"}, {"t": "3:54", "line": "Their followers.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145909_8f58a2fa-9ba9-47db-b7c1-9433d19b9ce6.png"}, {"t": "3:55", "line": "Their procurement team.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145914_f2bd6c0f-de99-4c79-b965-d0a2eb5e5d59.png"}, {"t": "3:57", "line": "Charlie Munger spent his whole life warning about exactly this mechanism.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145917_c22ab7d7-d7d2-46e7-b84c-bb7b572dc57b.png"}, {"t": "4:01", "line": "Show me the incentive and I'll show you the outcome.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145920_e0d89d61-928e-4726-9e31-a4d9e193fc1f.png"}, {"t": "4:03", "line": "The dashboard reward saves.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145922_e2a5e5f8-e5fe-478d-9569-f41ce8d9566c.png"}, {"t": "4:05", "line": "The dashboard never sees the rage.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145925_ac3e6635-91d9-4916-9775-575903de700b.png"}, {"t": "4:07", "line": "So the machine quietly optimises for trapped and angry.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145928_5e2fb688-10e5-43dc-be9d-12873ef5950f.png"}, {"t": "4:12", "line": "One more thing about that machine.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145930_c7f43da3-4b4d-493b-b0bb-f012d089cacf.png"}, {"t": "4:13", "line": "The sign up page and the cancel page are built by the same team.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145936_7ae66041-fdde-447a-98bc-0c3394e026be.png"}, {"t": "4:16", "line": "Same tools.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145941_e9bb8b85-6723-478b-9727-413599a92137.png"}, {"t": "4:17", "line": "A B-test.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145946_72636d69-59d9-4363-b3ab-297b4e0fd31d.png"}, {"t": "4:18", "line": "Button colours.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_145952_3c225112-619d-4aba-8bf4-1aa0d5a2645d.png"}, {"t": "4:19", "line": "Copy tweaks.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150009_6c2e5b64-96c5-4b38-82f2-35e90f80a7f4.png"}, {"t": "4:20", "line": "The difference is whose side the persuasion is on.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150014_6db22d95-4c2a-4a21-a6f4-a7933ae01fa9.png"}, {"t": "4:23", "line": "On the way in you and the company roughly want the same thing.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150724_355d7b97-0d65-4f40-bdbf-cf0b384dc61a.png"}, {"t": "4:26", "line": "The cancel page is the only page where your interests and theirs openly conflict.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150729_c2adde26-ce3b-4f81-967e-e60ebf4df6e6.png"}, {"t": "4:33", "line": "Persuasion doesn't stop at the exit.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150108_abaa2f26-f293-49f2-88c5-cce6c97744bc.png"}, {"t": "4:35", "line": "It switches sides.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150120_5ef15d34-146c-4076-95e3-6ad8b9048ff9.png"}, {"t": "4:36", "line": "Every trick that got you in running in reverse to keep you from leaving.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150136_4c60323e-a8dd-4694-a5eb-4f1b1e83979f.png"}, {"t": "4:40", "line": "Now scale it up.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150141_1208b09d-0741-426f-be6f-18970ac61102.png"}, {"t": "4:41", "line": "Because everything so far was pocket money.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150151_d3a740bd-2e02-4fae-84fb-9c8d47353006.png"}, {"t": "4:44", "line": "In business software the maze isn't three screens.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150154_9b7dca88-4f58-4c64-88d8-d8620ed2949f.png"}, {"t": "4:46", "line": "It's a contract.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150159_f48b4246-9658-442b-b0f8-5ac6fb2f406f.png"}, {"t": "4:48", "line": "The subscription renews automatically for a year.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150202_a7d91fbd-5c12-4504-a6f0-0821b8f49a12.png"}, {"t": "4:51", "line": "Unless you give notice 90 days in advance.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150214_6bd2d411-60bb-43ac-b27a-a44389137566.png"}, {"t": "4:54", "line": "In writing.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150217_9cb84de4-85e4-4bf5-8a4f-ddd2c920e1cc.png"}, {"t": "4:55", "line": "Per clause 14.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150220_390e8426-be5d-4034-88a1-c8210e123d9d.png"}, {"t": "4:56", "line": "Miss that window by a day you own another year.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150224_036a915e-45a4-488c-8906-ac7d64b85f16.png"}, {"t": "4:59", "line": "Or this one.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150227_2bd27ed9-d4e9-4e1a-9200-f79607a442a0.png"}, {"t": "5:00", "line": "To cancel please book a call with your customer success manager.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150230_33980e8a-2155-48f6-8d66-0408f9c9b256.png"}, {"t": "5:04", "line": "A meeting with one agenda item.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150233_3cef516f-94fd-4885-ba66-87df54363aa8.png"}, {"t": "5:06", "line": "Talking you out of the meeting.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150235_0b5dae59-6b04-4244-b8d8-471c3e32a58b.png"}, {"t": "5:07", "line": "Or the quiet one.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150237_872cbbb5-779d-462f-a1a6-9f2ef7a7761e.png"}, {"t": "5:08", "line": "Of course you can leave.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150240_0cea3f9a-938c-41bc-8d8f-647a41ed92fb.png"}, {"t": "5:10", "line": "Your data export will be ready in six to eight weeks.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150246_7c5bd809-33a6-489a-9318-eb330bbaf7e0.png"}, {"t": "5:12", "line": "Your own numbers held politely hostage.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150428_b036b02d-3432-482f-906b-079418accd42.png"}, {"t": "5:14", "line": "But here's the uncomfortable bit where this video breaks from the genre.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150733_f84db826-1229-4396-b48b-23ecf113901d.png"}, {"t": "5:18", "line": "Easy exit isn't automatically on your side either.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150735_8d9be4ac-0122-4e6c-a75a-0bc69940229c.png"}, {"t": "5:21", "line": "Some products genuinely need time.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150737_7585bc10-6c18-4c39-a2c8-2fa2439f78cc.png"}, {"t": "5:24", "line": "Ad campaigns need data before anyone can optimise them.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150740_a6f5994d-c360-4425-9607-d327cfd29441.png"}, {"t": "5:27", "line": "Nobody honest can show you results in three days.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150745_cf0ee5ef-2548-4b34-9888-8eb9b812b603.png"}, {"t": "5:30", "line": "A vendor that lets you walk in week one before the thing could possibly have worked.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150748_9c5d1ca9-93b3-453f-b099-066a333cfa3a.png"}, {"t": "5:34", "line": "Isn't being noble.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150753_a47fa7d1-c5f0-48a5-9d64-7b7bd9170188.png"}, {"t": "5:35", "line": "It's happy to take a month of your money and let you fail.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150756_615c50bc-8aa0-41c6-891b-1a66749d8222.png"}, {"t": "5:39", "line": "So the test isn't friction versus no friction.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150758_3d3643b8-0b6e-4d26-b7f2-704bd424857e.png"}, {"t": "5:42", "line": "The test is two questions.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150808_f838b95b-1373-4777-adc6-8581b68086c8.png"}, {"t": "5:44", "line": "Was the friction agreed in daylight?", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150811_934b32c3-6521-4186-8efb-20c094075a0b.png"}, {"t": "5:46", "line": "On the table.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150813_4ef88792-31c0-4689-881e-4605ec34313a.png"}, {"t": "5:47", "line": "Up front.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150816_11c39c3c-fc3a-49ff-a7f9-3e2c3af8fa1b.png"}, {"t": "5:48", "line": "Not discovered in clause 14.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150821_52f0a62c-d84f-4a32-b505-9dcb108ac8b6.png"}, {"t": "5:50", "line": "Two.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150827_6d539a5b-b6d9-4e7d-a999-aefbb7e137a6.png"}, {"t": "5:50b", "line": "Does it expire when the value arrives?", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150829_0d27d063-3fd1-45a2-9210-600ce1390038.png"}, {"t": "5:53", "line": "An annual contract with milestones set on day one.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150832_40325595-dacc-477e-a013-93d338909d64.png"}, {"t": "5:56", "line": "By week two you'll see this.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150833_e6cc2583-cd54-41f9-b8ea-5224fdfd2c4d.png"}, {"t": "5:57", "line": "By month two you'll see that.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150851_a0031dee-79f4-4643-9144-2e58c7dedd92.png"}, {"t": "5:58", "line": "Is commitment.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150854_49ed064d-0c51-41a2-8061-c8296e3b440e.png"}, {"t": "5:59", "line": "The identical contract with no milestones is a cage with a dashboard.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150859_20494120-5658-42bb-97ae-f65e2d3aca7e.png"}, {"t": "6:03", "line": "And that test cuts back at the seller.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150901_2a832c35-3ee8-48dc-ad18-bff505d447de.png"}, {"t": "6:06", "line": "If your product takes six months to show value, friction isn't protecting the journey.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150907_ebf2f6d9-1f4b-4742-8ee0-1a40a3ffdc76.png"}, {"t": "6:11", "line": "It's compensating for a design failure.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150909_9714ae41-25d8-4132-b2e4-43c8ff2895bb.png"}, {"t": "6:14", "line": "So what do you actually do with all this?", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150914_7d4d1a28-8348-4546-bb3f-acb32dcc4f3f.png"}, {"t": "6:16", "line": "One habit.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150917_b2076ece-815b-4af1-be51-bbc30ff0d9d7.png"}, {"t": "6:17", "line": "Check the exit before you enter.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150923_982a9387-88cf-4932-a109-3113371d6f80.png"}, {"t": "6:19", "line": "Before the free trial.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150926_426c2179-884c-4430-ae1a-d1949a579b54.png"}, {"t": "6:20", "line": "Before the signature.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150928_68f85029-07c6-4fff-872d-08538237405d.png"}, {"t": "6:22", "line": "Search the product name plus the word cancel.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150930_ad0918e4-f5a6-4ae1-970c-f13c33da49a1.png"}, {"t": "6:24", "line": "Count the steps.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150936_9d40715e-8a0c-4de3-839c-d4600f8efea2.png"}, {"t": "6:25", "line": "Read what former customers went through on the way out.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150938_7963db27-2804-4c04-b7f3-d6ccba0f24f8.png"}, {"t": "6:28", "line": "It works on a $9 app.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150945_b97c9c02-ad6a-46b9-acf5-c401c1008708.png"}, {"t": "6:30", "line": "It works on a $90,000 contract.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150947_838d639e-6ef3-4095-ac71-ce557d2f5aa0.png"}, {"t": "6:32", "line": "Same test.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150950_d0ac2c8e-3150-4ec4-8eb7-b9a155b525cf.png"}, {"t": "6:33", "line": "Because the cancellation flow is the one page a company builds.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_150953_e64faf3c-d1ef-4b95-a5bf-98251dc519b7.png"}, {"t": "6:37", "line": "For the moment your interests and theirs collide.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151001_3d615440-1b6d-4798-8aca-2c6656feec2e.png"}, {"t": "6:40", "line": "It predicts everything.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151005_1da3e6cc-208f-4357-8d75-35d99d8f02b2.png"}, {"t": "6:41", "line": "Support.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151019_fc344dc2-fffe-4809-87e8-9e3834ae2b4f.png"}, {"t": "6:42", "line": "Renewals.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151021_aa48dd83-c460-4ba9-8c0b-b756fc84d6fa.png"}, {"t": "6:43", "line": "How they'll treat you when there's nothing left to sell you.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151024_5f017414-d802-4ae8-b944-e41bfb079600.png"}, {"t": "6:46", "line": "The exit is part of the product.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151026_1646ee1b-afa1-4e74-9639-76a5aaa82be6.png"}, {"t": "6:48", "line": "Time to write it down.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151027_a631511e-f35d-446c-895b-9460c125ccf5.png"}, {"t": "6:49", "line": "This channel runs on numbered principles.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151030_78920144-6c12-45d8-bbf6-3b78fa3af59a.png"}, {"t": "6:51", "line": "You're meant to steal them.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151036_86b5dee8-cbda-4d7b-8a76-56acd428f16f.png"}, {"t": "6:53", "line": "Principle number one.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151038_eedfa678-6390-4fc6-b86d-237333d0b3ec.png"}, {"t": "6:54", "line": "Friction you agreed to is commitment.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151040_1d055cfd-d25f-4cc1-84ed-2d782d129f0d.png"}, {"t": "6:57", "line": "Friction you discover is a warning.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151043_da40ec70-eb08-4db9-a6ed-5e7a5430c625.png"}, {"t": "6:59", "line": "Sometimes the warning says trap.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151045_4cb4b090-b4ed-41ba-89d9-99fb4a6920ea.png"}, {"t": "7:01", "line": "Sometimes it just says nobody owns the exit.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151051_f0cf2897-136a-490e-9433-1914f2426375.png"}, {"t": "7:04", "line": "And nobody will own your problems after the sale either.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151053_d9631a19-a254-446a-9dee-1045ed99bb3b.png"}, {"t": "7:07", "line": "You don't need to know which.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151055_af6e9abc-1262-48ea-afca-8e516a9afebc.png"}, {"t": "7:08", "line": "Either way you learned who you're dealing with before it cost you.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151057_78da0a2e-0e88-434c-9220-731446dd3bba.png"}, {"t": "7:11", "line": "And because a principle you can't invert is just a poster.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151102_2e648f82-77ef-4bac-bb3a-66e06b7fb830.png"}, {"t": "7:14", "line": "Friction is legitimate when it's agreed up front.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151104_3bc3b74e-338d-4e3b-a2a2-7b80010845c7.png"}, {"t": "7:17", "line": "Tied to milestones.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151112_294cac01-1a54-417f-a6c3-a1f5a1eb4d2b.png"}, {"t": "7:18", "line": "And expiring the moment value arrives.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151115_43cf4267-ab6b-45ff-94ca-efed6d6b7db8.png"}, {"t": "7:21", "line": "For the sellers watching.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151117_e15decba-9782-4936-9531-ea5dce2ac5d7.png"}, {"t": "7:22", "line": "A customer kept by discovered friction isn't saved.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151132_1f4d8802-f495-41c7-b4bd-42957513de7c.png"}, {"t": "7:25", "line": "That's churn deferred.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151134_8b5106d9-381f-4556-b6eb-a8aeb1bef36b.png"}, {"t": "7:26", "line": "With interest.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151136_c4c8860a-5ed7-43b3-b046-b64f53018795.png"}, {"t": "7:28", "line": "They come back angrier.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151138_8d57b587-6120-42c0-b997-99bacec8a5d9.png"}, {"t": "7:29", "line": "Louder.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151142_c42ccc2d-2d8a-4d7f-b45c-6c76450115c5.png"}, {"t": "7:29b", "line": "And with an audience.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151144_21c8fe0a-e9b4-4315-9269-a5334bc7984f.png"}, {"t": "7:31", "line": "Somewhere this week you'll hit another 30 second sign up.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151146_c88dad99-5a39-4e4a-bd9b-ee7728c96250.png"}, {"t": "7:34", "line": "This time spend one extra minute first.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151149_dd251cbe-de69-48f7-8d01-6cb9b33c978a.png"}, {"t": "7:37", "line": "Look at the door you'd leave through.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151152_a2f5eb65-5d39-456c-a5ab-a550c9d90635.png"}, {"t": "7:38", "line": "It will tell you more than the sales page ever will.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151155_a5a22cb6-e929-44c1-8612-1539ac9574bd.png"}, {"t": "7:41", "line": "Next episode.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151159_8b854775-23e0-421a-b509-6a66ba0370c5.png"}, {"t": "7:42", "line": "The countdown timer that's lying to you.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151202_5c832d70-bc6e-4a42-a39f-87d18b111c61.png"}, {"t": "7:45", "line": "Only two rooms left at this price.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151205_8589c3e3-6d56-42c4-8601-a91868b49fb2.png"}, {"t": "7:47", "line": "The deal ends at midnight.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151207_d5fde9cc-3ed9-48b1-962f-f4746b7d96a6.png"}, {"t": "7:49", "line": "And the end of quarter discount that somehow exists every quarter.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151209_dc8f5600-198f-4c19-9a64-ab9b1830ab0f.png"}, {"t": "7:52", "line": "Manufactured scarcity from booking sites to enterprise sales.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151212_e7618d2b-41b1-4450-8c5c-bc907c7a6c1a.png"}, {"t": "7:56", "line": "Principle number two lives in that one.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151218_b38c4919-1449-4b3a-9f7d-c8d6698a871b.png"}, {"t": "7:58", "line": "Subscribe if you're collecting the set.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151222_3dc6d657-c146-47dc-978f-46cf79d0c487.png"}, {"t": "8:01", "line": "Drop the worst cancellation flow you've ever fought in the comments.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151227_4ce9d29a-c215-48cd-b91f-fb74c2ed016e.png"}, {"t": "8:05", "line": "The most painful one gets a full teardown in a future episode.", "url": "https://d8j0ntlcm91z4.cloudfront.net/user_3EUnbCIEVpH2hIQXUxeH1ytUa8a/hf_20260712_151230_b990b4a8-1dab-4fae-b8c8-1caf7c18bf56.png"}];
const grid=document.getElementById('grid');
const statusEl=document.getElementById('status');
let cancel=false;
function fname(t){const safe=document.getElementById('safe').checked;return (safe? t.replace(/:/g,'-'):t)+'.png';}
for(const it of DATA){
 const c=document.createElement('div');c.className='card';
 c.innerHTML=`<img loading="lazy" src="${it.url}" alt="">`+
  `<div class="meta"><span class="t">${it.t}</span> — ${it.line}`+
  `<br><a href="${it.url}" download="${it.t}.png" target="_blank" rel="noopener">save this one ↧</a></div>`;
 grid.appendChild(c);
}
async function dl(it){
 try{
  const r=await fetch(it.url,{mode:'cors'});
  if(!r.ok) throw 0;
  const b=await r.blob();
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=fname(it.t);
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
  return true;
 }catch(e){return false;}
}
document.getElementById('all').onclick=async()=>{
 cancel=false;let ok=0,bad=0;
 for(let i=0;i<DATA.length;i++){
  if(cancel){statusEl.textContent=`stopped at ${i}/${DATA.length}`;return;}
  statusEl.textContent=`downloading ${i+1}/${DATA.length}…`;
  const good=await dl(DATA[i]);good?ok++:bad++;
  await new Promise(r=>setTimeout(r,350));
 }
 statusEl.textContent=`done — ${ok} saved${bad?`, ${bad} blocked (use per-card save links)`:''}`;
};
document.getElementById('stop').onclick=()=>{cancel=true;};
</script></body></html>
